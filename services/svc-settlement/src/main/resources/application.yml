server:
  port: 8085

spring:
  application:
    name: svc-settlement

  datasource:
    url: jdbc:postgresql://localhost:5438/settlementdb
    username: settlement
    password: settlement
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: settlement-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.expenses.common.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.expenses.common.event.DomainEvent
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/expenses

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.expenses.svcsettle: DEBUG
    org.springframework.kafka: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Custom application properties
app:
  settlement:
    # Automatic debt optimization settings
    auto-optimization:
      enabled: true
      minimum-amount: 10.00
      schedule: "0 0 2 * * ?" # Daily at 2 AM

    # Payment reminders
    payment-reminders:
      enabled: true
      days-before-due: 3
      overdue-reminder-interval: 7

    # Proposal expiry
    default-expiry-days: 30
    auto-expire-check: "0 0 1 * * ?" # Daily at 1 AM

    # Settlement templates
    templates:
      max-per-group: 10
      auto-create-enabled: true

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://pg-settlement:5432/settlementdb
    username: settlement
    password: settlement

  kafka:
    bootstrap-servers: kafka:9092

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/expenses
