# =============================================================================
# Settlement Service Configuration
# =============================================================================
# This configuration file contains all settings for the Settlement Service including
# server, database, security, messaging, and API documentation settings.

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
server:
  port: 8085
  servlet:
    context-path: /

# -----------------------------------------------------------------------------
# Spring Application Configuration
# -----------------------------------------------------------------------------
spring:
  application:
    name: svc-settlement

  # -------------------------------------------------------------------------
  # Database Configuration
  # -------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://pg-settlement:5432/settlementdb
    username: settlement
    password: settlement
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # -------------------------------------------------------------------------
  # JPA/Hibernate Configuration
  # -------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # -------------------------------------------------------------------------
  # Database Migration (Flyway)
  # -------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # -------------------------------------------------------------------------
  # Kafka Messaging Configuration
  # -------------------------------------------------------------------------
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
    consumer:
      group-id: svc-settlement-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

  # -------------------------------------------------------------------------
  # Security Configuration (OAuth2 Resource Server)
  # -------------------------------------------------------------------------
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT validation using JWKS endpoint
          # This approach avoids strict issuer matching issues
          jwk-set-uri: http://host.docker.internal:8090/realms/expenses/protocol/openid-connect/certs
          # Optional: Custom claim validation
          # issuer-uri: http://host.docker.internal:8090/realms/expenses

# -----------------------------------------------------------------------------
# Actuator Configuration (Health Checks & Metrics)
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
  info:
    env:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# -----------------------------------------------------------------------------
# SpringDoc OpenAPI Configuration
# -----------------------------------------------------------------------------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    filter: true
    tags-sorter: alpha
    operations-sorter: method
    try-it-out-enabled: true
    request-snippets-enabled: true
  api-docs:
    enabled: true
    groups:
      enabled: true
    path: /v3/api-docs
  show-actuator: false

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging:
  level:
    com.expenses.svcsettle: INFO
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# -----------------------------------------------------------------------------
# Feign Client Configuration
# -----------------------------------------------------------------------------
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
  circuitbreaker:
    enabled: true

# -----------------------------------------------------------------------------
# Service URLs
# -----------------------------------------------------------------------------
services:
  group:
    url: http://svc-group:8082

# -----------------------------------------------------------------------------
# Custom Application Properties
# -----------------------------------------------------------------------------
app:
  settlement:
    # Automatic debt optimization settings
    auto-optimization:
      enabled: true
      minimum-amount: 10.00
      schedule: "0 0 2 * * ?" # Daily at 2 AM

    # Payment reminders
    payment-reminders:
      enabled: true
      days-before-due: 3
      overdue-reminder-interval: 7

    # Proposal expiry
    default-expiry-days: 30
    auto-expire-check: "0 0 1 * * ?" # Daily at 1 AM

    # Settlement templates
    templates:
      max-per-group: 10
      auto-create-enabled: true

---
# Local development profile
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5438/settlementdb
    username: settlement
    password: settlement

  kafka:
    bootstrap-servers: localhost:9092

  security:
    oauth2:
      resourceserver:
        jwt:
          # JWT validation using JWKS endpoint for local development
          jwk-set-uri: http://localhost:8090/realms/expenses/protocol/openid-connect/certs
