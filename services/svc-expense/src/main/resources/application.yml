server:
  port: 8083
spring:
  application:
    name: svc-expense
  datasource:
    url: jdbc:postgresql://pg-expense:5432/expensedb
    username: expense
    password: expense
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/expenses/protocol/openid-connect/certs
management.endpoints.web.exposure.include: health,info,prometheus

# Feign configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
  circuitbreaker:
    enabled: true

# Service URLs
services:
  group:
    url: http://svc-group:8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    filter: true
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    enabled: true
    groups:
      enabled: true

---
# Development profile for local development
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5435/expensedb
    username: expense
    password: expense

  kafka:
    bootstrap-servers: localhost:9092

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8090/realms/expenses/protocol/openid-connect/certs

# Service URLs for local development
services:
  group:
    url: http://localhost:8082
