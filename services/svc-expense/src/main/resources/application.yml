server:
  port: 8080
spring:
  application:
    name: svc-expense
  datasource:
    url: jdbc:postgresql://pg-expense:5432/expensedb
    username: expense
    password: expense
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/expenses/protocol/openid-connect/certs
management.endpoints.web.exposure.include: health,info,prometheus
