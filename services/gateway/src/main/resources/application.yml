server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      default-filters:
        - RemoveRequestHeader=Cookie
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://*.expenses-platform.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # API Documentation Routes (served locally by the gateway app)
        # Note: Do NOT self-route Swagger static assets or swagger-config through lb://gateway
        # The following service API docs routes remain to proxy to downstream services

        - id: user-api-docs
          uri: http://svc-user:8080
          predicates:
            - Path=/v3/api-docs/users
          filters:
            - RewritePath=/v3/api-docs/users, /v3/api-docs

        - id: group-api-docs
          uri: http://svc-group:8080
          predicates:
            - Path=/v3/api-docs/groups
          filters:
            - RewritePath=/v3/api-docs/groups, /v3/api-docs

        - id: expense-api-docs
          uri: http://svc-expense:8080
          predicates:
            - Path=/v3/api-docs/expenses
          filters:
            - RewritePath=/v3/api-docs/expenses, /v3/api-docs

        - id: ledger-api-docs
          uri: http://svc-ledger:8080
          predicates:
            - Path=/v3/api-docs/ledger
          filters:
            - RewritePath=/v3/api-docs/ledger, /v3/api-docs

        - id: settlement-api-docs
          uri: http://svc-settlement:8085
          predicates:
            - Path=/v3/api-docs/settlements
          filters:
            - RewritePath=/v3/api-docs/settlements, /v3/api-docs

        - id: split-engine-api-docs
          uri: http://svc-split-engine:8084
          predicates:
            - Path=/v3/api-docs/split-engine
          filters:
            - RewritePath=/v3/api-docs/split-engine, /v3/api-docs

        - id: fx-api-docs
          uri: http://svc-fx:8080
          predicates:
            - Path=/v3/api-docs/fx
          filters:
            - RewritePath=/v3/api-docs/fx, /v3/api-docs

        # User Service Routes
        - id: svc-user
          uri: lb://svc-user
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/(?<segment>.*), /api/me/$\{segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100

        # Group Service Routes
        - id: svc-group
          uri: lb://svc-group
          predicates:
            - Path=/api/groups/**
          filters:
            - RewritePath=/api/groups/(?<segment>.*), /api/groups/$\{segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60

        # Expense Service Routes
        - id: svc-expense
          uri: lb://svc-expense
          predicates:
            - Path=/api/expenses/**
          filters:
            - RewritePath=/api/expenses/(?<segment>.*), /api/expenses/$\{segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 40
                redis-rate-limiter.burstCapacity: 80

        # Split Engine Service Routes
        - id: svc-split-engine
          uri: lb://svc-split-engine
          predicates:
            - Path=/api/splits/**
          filters:
            - RewritePath=/api/splits/(?<segment>.*), /api/splits/$\{segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40

        # Ledger Service Routes (Internal only)
        - id: svc-ledger
          uri: lb://svc-ledger
          predicates:
            - Path=/internal/ledger/**
          filters:
            - RewritePath=/internal/ledger/(?<segment>.*), /api/ledger/$\{segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        # FX Service Routes
        - id: svc-fx
          uri: lb://svc-fx
          predicates:
            - Path=/api/fx/**
          filters:
            - RewritePath=/api/fx/(?<segment>.*), /api/fx/$\{segment}
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 60
                redis-rate-limiter.burstCapacity: 120

      # Load Balancer Configuration
      loadbalancer:
        use404: true

      # Discovery Configuration
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
        client:
          simple:
            instances:
              svc-user:
                - uri: http://svc-user:8080
              svc-group:
                - uri: http://svc-group:8080
              svc-expense:
                - uri: http://svc-expense:8080
              svc-ledger:
                - uri: http://svc-ledger:8080
              svc-settlement:
                - uri: http://svc-settlement:8080
              svc-split-engine:
                - uri: http://svc-split-engine:8080
              svc-fx:
                - uri: http://svc-fx:8080
    circuitbreaker:
      resilience4j:
        enabled: true
      circuit-breaker:
        configs:
          default:
            sliding-window-size: 10
            minimum-number-of-calls: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10000
            permitted-number-of-calls-in-half-open-state: 3
            automatic-transition-from-open-to-half-open-enabled: true

  main:
    web-application-type: reactive

  # Redis for Rate Limiting
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/expenses/protocol/openid-connect/certs

  # Simple Discovery Client mapping moved under spring.cloud above

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# SpringDoc Configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    config-url: /internal/api-docs/swagger-config
    disable-swagger-default-url: true
    display-request-duration: true
    urls-primary-name: Gateway Service
  api-docs:
    path: /internal/api-docs
    enabled: true
  cache:
    disabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
