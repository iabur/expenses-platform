server:
  port: 8080
spring:
  application:
    name: svc-user
  datasource:
    url: jdbc:postgresql://pg-user:5432/userdb
    username: user
    password: user
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
security:
  oauth2:
    resourceserver:
      jwt:
        jwk-set-uri: http://keycloak:8080/realms/expenses/protocol/openid-connect/certs
management.endpoints.web.exposure.include: health,info,prometheus
