version: "3.9"
services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./services/svc-identity-config/keycloak-realm-expenses.json:/opt/keycloak/data/import/realm.json
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    command: redis-server --appendonly yes

  pg-user:
    image: postgres:16
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports: ["5433:5432"]

  pg-group:
    image: postgres:16
    environment:
      POSTGRES_DB: groupdb
      POSTGRES_USER: group
      POSTGRES_PASSWORD: group
    ports: ["5434:5432"]

  pg-expense:
    image: postgres:16
    environment:
      POSTGRES_DB: expensedb
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports: ["5435:5432"]

  pg-ledger:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerdb
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports: ["5436:5432"]

  pg-split-engine:
    image: postgres:16
    environment:
      POSTGRES_DB: splitenginedb
      POSTGRES_USER: splitengine
      POSTGRES_PASSWORD: splitengine
    ports: ["5437:5432"]

  pg-settlement:
    image: postgres:16
    environment:
      POSTGRES_DB: settlementdb
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement
    ports: ["5438:5432"]

  gateway:
    build: ./services/gateway
    depends_on: [keycloak, redis]
    ports: ["8080:8080"]
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  svc-user:
    build: ./services/svc-user
    depends_on: [pg-user, keycloak]
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  svc-group:
    build: ./services/svc-group
    depends_on: [pg-group, keycloak]
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  svc-expense:
    build: ./services/svc-expense
    depends_on: [pg-expense, kafka, keycloak]
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  svc-fx:
    build: ./services/svc-fx
    depends_on: [keycloak]
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  svc-ledger:
    build: ./services/svc-ledger
    depends_on: [pg-ledger, kafka, keycloak]
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  svc-split-engine:
    build: ./services/svc-split-engine
    depends_on: [pg-split-engine, kafka, keycloak]
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  svc-settlement:
    build: ./services/svc-settlement
    depends_on: [pg-settlement, kafka, keycloak]
    environment:
      - SPRING_PROFILES_ACTIVE=docker
